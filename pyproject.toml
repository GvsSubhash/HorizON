[project]
name = "horizon"
version = "0.1.0"
description = "Multi-Horizon Deep Operator Network (HorizON) for multi-fidelity, multi-property, multi-horizon battery materials prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.20.0",
    "optuna>=4.3.0",
    "optuna-integration[tfkeras]>=4.3.0",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "scikit-learn>=1.6.1",
    "matplotlib>=3.10.3",
    "rdkit>=2025.9.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
